
name: MDVE Release Build

on:
  
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.7.0

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.7.0 --distribution-type bin

      - name: Install launcher icons
        run: |
          mkdir -p app/src/main/res
          unzip -o MDVE_launcher_icons.zip -d app/src/main/res

      - name: Prepare release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Missing RELEASE_KEYSTORE_BASE64 secret"
            exit 1
          fi

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks

          if [ ! -s app/release-key.jks ]; then
            echo "Keystore file is empty"
            exit 1
          fi

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "One or more signing secrets are missing"
            exit 1
          fi

          ./gradlew assembleRelease

      - name: Rename Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/MDVE-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MDVE-release
          path: release/MDVE-release.apk
          if-no-files-found: error
